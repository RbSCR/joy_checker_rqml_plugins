# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the mentioned branch(es)
  push:
    branches: [ "rolling" ]
  pull_request:
    branches: [ "rolling" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  Linting:
    name: Lint Code Base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        run: | # qmlformat is in the dev tools
          sudo apt-get update && sudo apt-get install -y clang-format cppcheck libxml2-utils qt6-declarative-dev-tools
          sudo ln -s /usr/lib/qt6/bin/qmlformat /usr/local/bin/qmlformat

      - name: Install and Run pre-commit
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files
